name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: |
          shellcheck stingy-guard/bin/check-efficiency.sh
          shellcheck stingy-guard/bin/toggle-hook.sh
          shellcheck .claude/statusline-stingy.sh

      - name: Verify all SKILL.md files exist
        run: |
          skills=(
            stingy-slim
            stingy-audit
            stingy-route
            stingy-burn
            stingy-compare
            stingy-budget
            stingy-ration
            stingy-guard
          )
          missing=0
          for skill in "${skills[@]}"; do
            if [ ! -f "$skill/SKILL.md" ]; then
              echo "MISSING: $skill/SKILL.md"
              missing=$((missing + 1))
            else
              echo "OK: $skill/SKILL.md"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing SKILL.md file(s) missing"
            exit 1
          fi

      - name: Run setup in temp HOME
        run: |
          export HOME="$(mktemp -d)"
          ./setup --yes

      - name: Run tests
        if: ${{ hashFiles('tests/') != '' }}
        run: |
          if [ -f tests/run ]; then
            bash tests/run
          else
            failed=0
            for f in tests/*.sh; do
              [ -f "$f" ] || continue
              echo "--- $f"
              bash "$f" || failed=$((failed + 1))
            done
            if [ "$failed" -gt 0 ]; then
              echo "$failed test file(s) failed"
              exit 1
            fi
          fi
